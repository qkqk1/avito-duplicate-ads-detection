[project]
name = "avito-dups"
version = "0.1.0"
description = "Поиск дублей объявлений на маркетплейсе: попарная классификация на данных Avito Duplicate Ads Detection"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pavel Tilga" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pyarrow>=15",
]

[project.scripts]
avito-dups = "avito_dups.cli:main"

[tool.poetry]
packages = [{ include = "avito_dups", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
ruff = ">=0.5"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
